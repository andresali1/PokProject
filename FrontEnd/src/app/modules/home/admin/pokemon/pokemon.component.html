<div class="createBtn">
  <button mat-flat-button color="primary" (click)="openForm(false)">
    Crear
  </button>
</div>

<div class="infoTable">
  <div class="contentTable">
    <table mat-table [dataSource]="pokemons" class="mat-elevation-z8">
      <!-- Position Column -->
      <ng-container matColumnDef="pokedex">
        <th mat-header-cell *matHeaderCellDef>No. Pokedex</th>
        <td mat-cell *matCellDef="let element">{{ element.pokedex }}</td>
      </ng-container>

      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef>Imágen</th>
        <td mat-cell *matCellDef="let element">
          <div class="imgContainer">
            <img
              [src]="
                element.image
                  ? element.image
                  : '../../../../../assets/img/default.jpg'
              "
              alt=""
            />
          </div>
        </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let element">{{ element.nombre }}</td>
      </ng-container>

      <!-- Position Column -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let element">{{ element.tipo.nombre }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="action">
        <th class="tableHeader" mat-header-cell *matHeaderCellDef>Acción</th>
        <td class="contentLeft" mat-cell *matCellDef="let element">
          <div class="botones">
            <button
              class="editBtn"
              color="primary"
              mat-mini-fab
              aria-label="Editar"
              (click)="openForm(true)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              class="deleteBtn"
              color="warn"
              mat-mini-fab
              aria-label="Eliminar"
              (click)="deleteDialog()"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <mat-paginator
    [pageSizeOptions]="[5, 10, 20, 50]"
    showFirstLastButtons
    [length]="cantidadTotalRegistros"
    [pageSize]="cantidadRegistrosAMostrar"
    class="mat-elevation-z8"
    (page)="actualizarPaginacion($event)"
  ></mat-paginator>
</div>
