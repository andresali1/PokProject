<div class="createBtn">
  <button mat-flat-button color="primary" (click)="openForm()">Crear</button>
</div>

<div class="infoTable">
  <div class="contentTable">
    <table mat-table [dataSource]="users" class="mat-elevation-z8">
      <!-- Position Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>No.</th>
        <td mat-cell *matCellDef="let element">{{ element.id }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let element">{{ element.email }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let element">
          <mat-icon [className]="element.active ? 'check' : 'close'">{{
            element.active ? "check" : "close"
          }}</mat-icon>
        </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="action">
        <th mat next page not working-header-cell *matHeaderCellDef>Acción</th>
        <td class="contentLeft" mat-cell *matCellDef="let element">
          <div class="botones">
            <button
              class="editBtn"
              color="primary"
              mat-mini-fab
              aria-label="Hacer Admin"
              matTooltip="Hacer Admin"
              (click)="hacerAdmin(element.id)"
            >
              <mat-icon>note_add</mat-icon>
            </button>
            <button
              class="editBtn"
              color="accent"
              mat-mini-fab
              aria-label="Remover Admin"
              matTooltip="Remover Admin"
              (click)="removerAdmin(element.id)"
            >
              <mat-icon>no_sim</mat-icon>
            </button>
            <button
              class="deleteBtn"
              color="warn"
              mat-mini-fab
              aria-label="Eliminar"
              matTooltip="Eliminar"
              (click)="deleteDialog(element.id)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <mat-paginator
    [pageSizeOptions]="[5, 10, 20, 50]"
    showFirstLastButtons
    [length]="cantidadTotalRegistros"
    [pageSize]="cantidadRegistrosAMostrar"
    class="mat-elevation-z8"
    (page)="actualizarPaginacion($event)"
  ></mat-paginator>
</div>
