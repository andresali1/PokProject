<mat-card>
  <div class="code"><span>150</span></div>
  <mat-card-content>
    <div class="cardImg">
      <img src="../../../../assets/img/fondo.jpg" mat-card-image />
    </div>
    <div class="cardInfo">
      <span class="cardInfo-title">Pikachu</span>
      <span>Eléctico</span>
    </div>
  </mat-card-content>
  <mat-card-footer>
    <div class="buttons">
      <button
        class="editBtn"
        mat-mini-fab
        aria-label="Editar"
        (click)="editDialog()"
      >
        <mat-icon>edit</mat-icon>
      </button>
      <button
        class="deleteBtn"
        mat-mini-fab
        aria-label="Eliminar"
        (click)="closeDialog()"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </mat-card-footer>
</mat-card>
