<h2 mat-dialog-title>Confirmación</h2>
<mat-dialog-content class="mat-typography">
  <h3>¿Está seguro de querer eliminar?</h3>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button
    mat-raised-button
    color="warn"
    [mat-dialog-close]="data.id"
    cdkFocusInitial
  >
    Eliminar
  </button>
</mat-dialog-actions>
