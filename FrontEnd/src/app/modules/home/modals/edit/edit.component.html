<h2 mat-dialog-title>Editar Pokemón</h2>
<mat-dialog-content class="mat-typography">
  <app-form-pokemon [isEdit]="isEdit"></app-form-pokemon>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button
    mat-raised-button
    color="primary"
    [mat-dialog-close]="false"
    cdkFocusInitial
  >
    Guardar
  </button>
</mat-dialog-actions>
