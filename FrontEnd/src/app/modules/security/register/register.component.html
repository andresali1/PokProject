<div class="loginPage">
  <div class="container">
    <mat-card>
      <h2 class="textWhite">Formulario Registro</h2>
      <form [formGroup]="form" (submit)="getRegister(form.value)">
        <div class="inputs">
          <mat-form-field appearance="fill" class="textWhite">
            <mat-label class="textWhite">Email</mat-label>
            <input formControlName="email" matInput />
          </mat-form-field>

          <mat-form-field appearance="fill" class="textWhite">
            <mat-label class="textWhite">Contraseña</mat-label>
            <input
              [type]="hide ? 'password' : 'text'"
              formControlName="password"
              matInput
            />
            <mat-icon matSuffix (click)="hide = !hide">{{
              hide ? "visibility_off" : "visibility"
            }}</mat-icon>
          </mat-form-field>
        </div>

        <div class="buttons">
          <button mat-flat-button color="primary" [disabled]="form.invalid">
            Registrarse
          </button>
          <a mat-stroked-button color="accent" (click)="getLogin()">Login</a>
        </div>

        <div class="message">
          <span class="error" *ngFor="let error of errors">
            <p>{{ error }}</p>
          </span>
        </div>
      </form>
    </mat-card>
  </div>
</div>
