<div class="content">
  <div class="imageForm">
    <div class="imageForm-display">
      <div class="image" *ngIf="objPokemon.image || imagenBase64">
        <img
          [src]="imagenCambiada ? imagenBase64 : objPokemon.image"
          alt="Pokemon Img"
        />
      </div>
    </div>
    <div class="uploadBtn">
      <button mat-raised-button (click)="fileInput.click()">
        Seleccionar imagen
      </button>
      <input type="file" hidden #fileInput (change)="guardarImagen($event)" />
    </div>
  </div>
  <div class="contentForm">
    <div class="contentForm-data">
      <form [formGroup]="form">
        <mat-form-field appearance="outline">
          <mat-label>Número pokedex</mat-label>
          <input [readonly]="isEdit" formControlName="pokedex" matInput />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input formControlName="nombre" matInput />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Tipo</mat-label>
          <mat-select formControlName="tipoId">
            <mat-option *ngFor="let tipo of tipos" [value]="tipo.id">
              {{ tipo.nombre }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <div class="buttons" *ngIf="fromAdmin">
          <a mat-stroked-button color="warn" (click)="cancel()">Cancelar</a>
          <button
            mat-flat-button
            color="primary"
            [disabled]="form.invalid"
            (click)="save(form.value)"
          >
            Crear
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
